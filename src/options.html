<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Jev Tab Switcher Options</title>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1e1f22; --fg:#ececf1; --muted:#9a9aa2; --line:#3a3b40; } }
    body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, sans-serif; max-width:560px; margin:40px auto; padding:0 16px; }
    label { display:block; margin-top:16px; font-weight:600; }
    small { display:block; color:var(--muted); font-weight:400; }
    input { width:100%; padding:8px; margin-top:4px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
    button { margin-top:20px; padding:8px 16px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
    #msg { color:var(--muted); margin-left:10px; }
  </style>
</head>
<body>
  <h1>Jev Tab Switcher</h1>
  <p>Press <b>⌘⇧K</b> (Ctrl+Shift+K elsewhere) or type <b>t</b> + space in the address bar. Change the shortcut at <code>chrome://extensions/shortcuts</code>.</p>

  <label>API key
    <small>An OpenRouter key works with the default endpoint. It's stored only in this browser's local extension storage.</small>
    <input id="apiKey" type="password" placeholder="sk-or-..." />
  </label>
  <label>Endpoint
    <small>OpenRouter Decisions API by default. AIML API: https://api.aimlapi.com/v1/decisions</small>
    <input id="endpoint" type="url" />
  </label>
  <label>Model
    <small>typesafe/jev-1.14, typesafe/jev-1.13, or ~typesafe/jev-latest</small>
    <input id="model" type="text" />
  </label>
  <label>Auto-switch threshold
    <small>Switch immediately when Jev gives the top tab at least this probability. Otherwise show a short list.</small>
    <input id="minProb" type="number" min="0" max="1" step="0.05" />
  </label>
  <label>Max tabs sent to Jev
    <small>Above this many open tabs, keyword matches plus the most recent tabs are sent.</small>
    <input id="maxCandidates" type="number" min="5" max="250" step="5" />
  </label>
  <button id="save">Save</button><button id="test">Test connection</button><span id="msg"></span>
  <script type="module" src="options.js"></script>
</body>
</html>
